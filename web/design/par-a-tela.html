<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paralelismo A · La tela (ocupación como tejido)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Solway:wght@400;500;700;800&display=swap"
      rel="stylesheet">
    <style>
    :root {
      --indigo: oklch(0.26 0.055 265);
      --indigo-deep: oklch(0.21 0.05 265);
      --thread: oklch(0.9 0.025 85);
      --thread-dim: oklch(0.78 0.04 85);
      --madder: oklch(0.58 0.16 28);
      --mustard: oklch(0.78 0.12 85);
      --seam: oklch(0.36 0.05 265);
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--indigo);
      color: var(--thread);
      font-family: "Alegreya", serif;
      font-size: 1.05rem;
      line-height: 1.6;
      min-height: 100vh;
      padding: clamp(1.5rem, 5vh, 4rem) clamp(1.25rem, 5vw, 3rem);
    }
    .frame { max-width: 62rem; margin-inline: auto; }
    h1 { font-family: "Solway", serif; font-weight: 700; font-size: clamp(1.6rem, 3.4vw, 2.4rem); }
    .sub { font-style: italic; color: var(--thread-dim); margin-top: 0.3rem; }
    .steps { margin-top: 1.6rem; display: inline-flex; }
    .step {
      background: none; border: 1px solid var(--seam); color: var(--thread-dim);
      font-family: "Solway", serif; font-size: 0.9rem; padding: 0.42rem 1rem; cursor: pointer;
    }
    .step + .step { border-left: 0; }
    .step[aria-pressed="true"] { color: var(--indigo-deep); background: var(--mustard); border-color: var(--mustard); }
    .stage { margin-top: 1.1rem; border: 1px solid var(--seam); background: var(--indigo-deep); }
    canvas { display: block; width: 100%; height: clamp(300px, 44vh, 440px); }
    .meta {
      margin-top: 0.9rem; display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    }
    .pct {
      font-family: "Solway", serif; font-weight: 800; font-size: 2.6rem;
      font-variant-numeric: tabular-nums; color: var(--mustard); min-width: 5.2ch;
    }
    .pct.low { color: var(--madder); }
    .metalabel { color: var(--thread-dim); font-size: 0.95rem; max-width: 34ch; }
    .cap { margin-top: 0.9rem; max-width: 64ch; }
    .cap b { color: var(--mustard); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="frame">
      <h1>A · La tela</h1>
      <p class="sub">
        Una radiografía de la máquina trabajando. Cada fila es uno de sus 32 carriles;
        cada columna que entra por la derecha, un ciclo de reloj. Celda coloreada:
        ese carril trabajó ese ciclo. Hueco: carril parado.
      </p>
      <div class="steps" role="group">
        <button class="step" data-mode="grid" aria-pressed="true">1 · La rejilla</button>
        <button class="step" data-mode="split" aria-pressed="false">2 · La grieta</button>
        <button class="step" data-mode="tree" aria-pressed="false">3 · El árbol</button>
      </div>
      <div class="stage"><canvas id="cv"></canvas></div>
      <div class="meta">
        <span class="pct" id="pct">100%</span>
        <span class="metalabel">del silicio tejiendo, medido sobre las últimas 120 columnas de tela</span>
      </div>
      <p class="cap" id="cap"></p>
    </div>
    <script type="module">
      const CAPS = {
        grid: "<b>Trabajo regular.</b> Los 32 carriles trabajan en cada ciclo, sin un solo hueco. Esto es una GPU haciendo lo suyo.",
        split: "<b>Un «si» lo parte.</b> Los datos se dividen en dos ramas y la máquina solo puede ejecutar una a la vez: la mitad de los carriles queda parada en cada pasada. Cada hueco es silicio pagado que no trabaja.",
        tree: "<b>Trabajo irregular.</b> Las tareas nacen y mueren durante el propio cálculo: rachas en las que hay faena para todos y sequías en las que casi todo pende de un par de carriles. Ninguna máquina de formación cerrada rellena esto; hace falta una que reparta el trabajo sobre la marcha.",
      };
      const cv = document.getElementById("cv");
      const cx = cv.getContext("2d");
      const pctEl = document.getElementById("pct");
      const capEl = document.getElementById("cap");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const MUSTARD = "oklch(0.78 0.12 85)";
      const MADDER = "oklch(0.62 0.17 28)";
      const WARP = "oklch(0.34 0.05 265)";

      let mode = "grid";
      const LANES = 32;
      let cols = []; // cada columna: Uint8Array(LANES); 0 agujero, 1 mostaza, 2 rubia
      let tick = 0;

      // el simulador del árbol: una cola de tareas y 32 obreros, con DEPENDENCIAS.
      // El cálculo alterna regímenes: expansión (cada tarea acabada engendra
      // 1..3 hijas) y poda (casi ninguna engendra). Sin esto, el backlog de
      // tareas independientes alisa la ocupación al 100% y la irregularidad
      // no se ve. La cola va capada: solo existe la frontera del árbol, no un
      // almacén infinito de faena.
      let queue = 1;
      let boom = true;
      let regimeLeft = 26;
      let fert = 1.6; // hijas esperadas por tarea acabada, cambia por régimen
      const QCAP = 24;
      const rem = new Array(LANES).fill(0);
      function treeColumn() {
        if (--regimeLeft <= 0) {
          boom = !boom;
          regimeLeft = boom ? 16 + Math.floor(Math.random() * 22) : 14 + Math.floor(Math.random() * 18);
          // cada régimen con su intensidad: brotes que apenas se sostienen,
          // podas suaves que tardan en secar; de ahí las rampas intermedias
          fert = boom ? 1.25 + Math.random() * 0.75 : 0.2 + Math.random() * 0.6;
        }
        const col = new Uint8Array(LANES);
        let busy = 0;
        for (let i = 0; i < LANES; i++) {
          if (rem[i] > 0) {
            rem[i]--;
            col[i] = 1;
            busy++;
            if (rem[i] === 0) {
              const k = Math.min(3, Math.floor(fert) + (Math.random() < fert % 1 ? 1 : 0));
              queue = Math.min(QCAP, queue + k);
            }
          } else if (queue > 0) {
            queue--;
            rem[i] = 2 + Math.floor(Math.random() * 5);
            col[i] = 1;
            busy++;
          }
        }
        // en expansión, una rama casi seca recibe empujón: las sequías se ven
        // (todo pende de un par de carriles) pero no se eternizan
        if (boom && busy < 4) queue = Math.min(QCAP, queue + 1);
        if (queue === 0 && rem.every((x) => x === 0)) queue = 1;
        return col;
      }

      function makeColumn() {
        const col = new Uint8Array(LANES);
        if (mode === "grid") { col.fill(1); return col; }
        if (mode === "split") {
          const phase = Math.floor(tick / 14) % 2;
          for (let i = 0; i < LANES; i++) {
            const branch = (i * 7 + 3) % 2;
            if (branch === phase) col[i] = branch === 0 ? 1 : 2;
          }
          return col;
        }
        return treeColumn();
      }

      function fit() {
        cv.width = cv.clientWidth * devicePixelRatio;
        cv.height = cv.clientHeight * devicePixelRatio;
      }
      fit();
      addEventListener("resize", fit);

      function draw() {
        const W = cv.width, H = cv.height, S = devicePixelRatio;
        cx.clearRect(0, 0, W, H);
        const cw = 9 * S;
        const laneH = H / LANES;
        // urdimbre: los 32 hilos siempre presentes, desnudos bajo los agujeros
        cx.lineWidth = 1 * S;
        cx.strokeStyle = WARP;
        for (let i = 0; i < LANES; i++) {
          const y = laneH * (i + 0.5);
          cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
        }
        // la tela: columnas de trama, la más nueva junto al peine (derecha)
        const n = cols.length;
        for (let k = 0; k < n; k++) {
          const x = W - 14 * S - (n - 1 - k) * cw;
          if (x + cw < 0) continue;
          const col = cols[k];
          for (let i = 0; i < LANES; i++) {
            if (!col[i]) continue;
            cx.fillStyle = col[i] === 1 ? MUSTARD : MADDER;
            // textura de tejido: alterna levemente la opacidad como sarga
            cx.globalAlpha = 0.78 + 0.22 * ((i + k) % 2);
            cx.fillRect(x, laneH * i + 1.2 * S, cw - 1.2 * S, laneH - 2.4 * S);
          }
        }
        cx.globalAlpha = 1;
        // el peine
        cx.fillStyle = "oklch(0.9 0.025 85)";
        cx.fillRect(W - 8 * S, 0, 2.4 * S, H);
      }

      function updatePct() {
        const last = cols.slice(-120);
        let woven = 0;
        for (const c of last) for (let i = 0; i < LANES; i++) if (c[i]) woven++;
        const pct = last.length ? Math.round(100 * woven / (last.length * LANES)) : 0;
        pctEl.textContent = pct + "%";
        pctEl.classList.toggle("low", pct < 70);
      }

      function step() {
        tick++;
        cols.push(makeColumn());
        const maxCols = Math.ceil(cv.width / (9 * devicePixelRatio)) + 4;
        while (cols.length > maxCols) cols.shift();
        draw();
        if (tick % 5 === 0) updatePct();
      }

      function reset() {
        cols = []; tick = 0; queue = 1; boom = true; regimeLeft = 26; fert = 1.6; rem.fill(0);
        capEl.innerHTML = CAPS[mode];
        if (reduced) {
          for (let i = 0; i < 260; i++) { tick++; cols.push(makeColumn()); }
          draw(); updatePct();
        }
      }

      document.querySelectorAll(".step").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll(".step").forEach((x) => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          mode = b.dataset.mode;
          reset();
        });
      });

      reset();
      if (!reduced) setInterval(step, 80);
    </script>
  </body>
</html>
